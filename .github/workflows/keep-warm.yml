# Keeps the free Render demo awake while DEV judges are reviewing (free instances sleep after 15 idle minutes).
# Stops pinging on its own after 27 Oct 2026.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "$(date -u +%Y%m%d)" -ge 20261027 ]; then echo "judging is over"; exit 0; fi
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 120 https://shelfmitra.onrender.com/api/health
