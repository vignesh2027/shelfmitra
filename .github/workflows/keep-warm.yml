# Keeps the free Render demo awake while DEV judges are reviewing (free instances sleep after 15 idle minutes).
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.run_started_at < '2026-10-27'
    steps:
      - run: curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 120 https://shelfmitra.onrender.com/api/health
